# Example: Setting LTS option for a Long Term Support version

# Application name and version
quarkus.application.name=my-lts-application
quarkus.application.version=3.8.0

# Mark this as a Long Term Support (LTS) version
# This is useful for production deployments and can be used by extensions
# to make decisions based on LTS status
quarkus.application.lts=true
